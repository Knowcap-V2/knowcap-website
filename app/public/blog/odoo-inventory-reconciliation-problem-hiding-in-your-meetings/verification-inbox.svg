<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="676" viewBox="0 0 1160 676" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
      .ink{fill:#18181B}.mut{fill:#6B6B6B}.faint{fill:#9A958C}
    </style>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#18181B" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1160" height="676" fill="#FBFAF8"/>
  <rect x="1" y="1" width="1158" height="674" rx="16" fill="none" stroke="#ECE8E1"/>
  <text x="40" y="58" class="ink" font-size="26" font-weight="700">Verification Inbox</text>
  <text x="40" y="86" class="mono mut" font-size="13">Odoo Partners · Outbound Inventory Audit &amp; Reconciliation</text>
  <g transform="translate(868,40)">
    <rect width="252" height="34" rx="17" fill="#EAF3EC" stroke="#CDE5D4"/>
    <circle cx="20" cy="17" r="4" fill="#1F6B3A"/>
    <text x="34" y="22" class="mono" font-size="12" fill="#1F6B3A" font-weight="700">9 claims · all human-confirmed</text>
  </g>
  <line x1="40" y1="106" x2="1120" y2="106" stroke="#ECE8E1"/>

  <g transform="translate(40,124)" filter="url(#sh)">
    <rect width="1080" height="116" rx="12" fill="#FFFFFF" stroke="#E7E3DC"/>
    <rect x="0" y="0" width="4" height="116" rx="2" fill="#4C8DF6"/>
    <rect x="24" y="22" width="94" height="22" rx="11" fill="#EAF1FE"/>
    <text x="71" y="37" text-anchor="middle" class="mono" font-size="11" fill="#2C5FB0" font-weight="700">DECISION</text>
    <text x="134" y="39" class="ink" font-size="16" font-weight="600">Carafe Small quantity corrected 3 → 2 — the entry of 3 was a mistake.</text>
    <text x="134" y="64" class="mut" font-size="13">Rationale: actual dispatched quantity was 2; the sheet value was a typo.</text>
    
    <g transform="translate(24,80)">
      <circle cx="8" cy="8" r="8" fill="#1F6B3A"/>
      <path d="M4.5 8 L7 10.5 L11.5 5.5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="12" class="mono" font-size="12" fill="#1F6B3A" font-weight="700">Confirmed</text>
      <text x="104" y="12" class="mono faint" font-size="12">Hassan Arslan · 34:13</text>
    </g>
  </g>

  <g transform="translate(40,252)" filter="url(#sh)">
    <rect width="1080" height="116" rx="12" fill="#FFFFFF" stroke="#E7E3DC"/>
    <rect x="0" y="0" width="4" height="116" rx="2" fill="#E0A33A"/>
    <rect x="24" y="22" width="62" height="22" rx="11" fill="#FBF1DC"/>
    <text x="55" y="37" text-anchor="middle" class="mono" font-size="11" fill="#A9781E" font-weight="700">RISK</text>
    <text x="102" y="39" class="ink" font-size="16" font-weight="600">Third incorrect inventory sheet this cycle — a recurring data-accuracy problem.</text>
    <text x="102" y="64" class="mut" font-size="13">Severity: medium · mitigation: verify before submission, find the root cause.</text>
    
    <g transform="translate(24,80)">
      <circle cx="8" cy="8" r="8" fill="#1F6B3A"/>
      <path d="M4.5 8 L7 10.5 L11.5 5.5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="12" class="mono" font-size="12" fill="#1F6B3A" font-weight="700">Confirmed</text>
      <text x="104" y="12" class="mono faint" font-size="12">Hassan Arslan · 42:54</text>
    </g>
  </g>

  <g transform="translate(40,380)" filter="url(#sh)">
    <rect width="1080" height="116" rx="12" fill="#FFFFFF" stroke="#E7E3DC"/>
    <rect x="0" y="0" width="4" height="116" rx="2" fill="#1F6B3A"/>
    <rect x="24" y="22" width="62" height="22" rx="11" fill="#EAF3EC"/>
    <text x="55" y="37" text-anchor="middle" class="mono" font-size="11" fill="#1F6B3A" font-weight="700">TASK</text>
    <text x="102" y="39" class="ink" font-size="16" font-weight="600">Joud → resolve two &quot;brandy&quot; items dispatched with no transfer or pick record.</text>
    <text x="102" y="64" class="mut" font-size="13">Assignee: Joud Aljunaidy · priority: high · due: today</text>
    
    <g transform="translate(24,80)">
      <circle cx="8" cy="8" r="8" fill="#1F6B3A"/>
      <path d="M4.5 8 L7 10.5 L11.5 5.5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="12" class="mono" font-size="12" fill="#1F6B3A" font-weight="700">Confirmed</text>
      <text x="104" y="12" class="mono faint" font-size="12">Hassan Arslan · 33:33</text>
    </g>
  </g>

  <g transform="translate(40,508)" filter="url(#sh)">
    <rect width="1080" height="116" rx="12" fill="#FFFFFF" stroke="#E7E3DC"/>
    <rect x="0" y="0" width="4" height="116" rx="2" fill="#8A8A8A"/>
    <rect x="24" y="22" width="62" height="22" rx="11" fill="#EFEDE9"/>
    <text x="55" y="37" text-anchor="middle" class="mono" font-size="11" fill="#5A5A5A" font-weight="700">FACT</text>
    <text x="102" y="39" class="ink" font-size="16" font-weight="600">128 + ~250 item discrepancy between the warehouse sheet and Odoo.</text>
    <text x="102" y="64" class="mut" font-size="13">Source: final comparison sheet, warehouse data vs Odoo · sent via Telegram.</text>
    
    <g transform="translate(24,80)">
      <circle cx="8" cy="8" r="8" fill="#1F6B3A"/>
      <path d="M4.5 8 L7 10.5 L11.5 5.5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="12" class="mono" font-size="12" fill="#1F6B3A" font-weight="700">Confirmed</text>
      <text x="104" y="12" class="mono faint" font-size="12">Hassan Arslan · 01:12</text>
    </g>
